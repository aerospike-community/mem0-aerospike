name: Agent Plugins TypeScript Checks

# Shared TypeScript runtime checks. Each consuming integration keeps its own
# build workflow, which is also triggered when this shared core changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/agent-plugin-core/typescript/**'
      - '.github/workflows/agent-plugins-typescript-checks.yml'
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: integrations/agent-plugin-core/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: integrations/agent-plugin-core/typescript
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: integrations/agent-plugin-core/typescript
        run: pnpm typecheck

      - name: Run tests
        working-directory: integrations/agent-plugin-core/typescript
        run: pnpm test
