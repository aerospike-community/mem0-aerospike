name: Auto-label issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
        id: issue-parser
        continue-on-error: true
        with:
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - uses: redhat-plumbers-in-action/advanced-issue-labeler@b80ae64e3e156e9c111b075bfa04b295d54e8e2e # v3.2.4
        continue-on-error: true
        with:
          issue-form: ${{ steps.issue-parser.outputs.jsonString }}
          token: ${{ secrets.GITHUB_TOKEN }}
          config-path: .github/advanced-issue-labeler.yml

      - name: Infer component from text when the form was not used
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const {
              componentLabels,
              inferComponentLabels,
              loadKeywords,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/infer-component-labels.js`);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const keywords = loadKeywords(`${process.env.GITHUB_WORKSPACE}/.github/component-keywords.json`);
            const known = componentLabels(keywords);
            const existing = issue.labels.map((label) => label.name || label);
            if (existing.some((name) => known.includes(name))) {
              core.info(`Component label already present: ${existing.join(', ')}`);
              return;
            }

            const labels = inferComponentLabels(`${issue.title}\n\n${issue.body || ''}`, keywords);

            if (labels.length === 0) {
              core.info('No component could be inferred from the issue text');
              return;
            }

            core.info(`Inferred: ${labels.join(', ')}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            });
